<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 状態
  var state = {
    token: localStorage.getItem('wfb_token') || '',
    user: null,        // ログイン中の本人情報
    settings: null,    // 学校名・勤務時間など
    view: 'mypage',
    adminSub: 'pending',
    adminData: null,   // 管理タブ用のキャッシュ
    adminFilter: { kind: '', status: '', member: '' },
    editingMember: null,
    wizard: null, // 年次更新ウィザードの進行状態
  };

  var STATUS_CHIP = {
    '承認待ち': 'pending',
    '承認済み': 'approved',
    '却下': 'rejected',
    '取消': 'canceled',
    '取下げ': 'withdrawn',
  };

  // ---------------------------------------------------------------- 汎用ヘルパー
  function $id(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function toMin(t) {
    var m = String(t == null ? '' : t).trim().match(/^([0-9]{1,2}):([0-9]{2})$/);
    if (!m) return null;
    var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }

  function toTime(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return h + ':' + (m < 10 ? '0' + m : m);
  }

  function fmtMin(min) {
    var sign = min < 0 ? '-' : '';
    var abs = Math.abs(min);
    var h = Math.floor(abs / 60), m = abs % 60;
    if (h === 0) return sign + m + '分';
    if (m === 0) return sign + h + '時間';
    return sign + h + '時間' + m + '分';
  }

  function todayStr() {
    var d = new Date();
    var mo = d.getMonth() + 1, da = d.getDate();
    return d.getFullYear() + '-' + (mo < 10 ? '0' + mo : mo) + '-' + (da < 10 ? '0' + da : da);
  }

  function chip(status) {
    return '<span class="chip ' + (STATUS_CHIP[status] || 'rejected') + '">' + esc(status) + '</span>';
  }

  function overlap(aS, aE, bS, bE) { return Math.max(0, Math.min(aE, bE) - Math.max(aS, bS)); }

  /** 5分刻みの時刻セレクト(6:00〜22:00) */
  function timeSelect(id, selected) {
    var html = '<select id="' + id + '" class="time" data-watch="preview">';
    for (var min = 360; min <= 1320; min += 5) {
      var t = toTime(min);
      html += '<option value="' + t + '"' + (t === selected ? ' selected' : '') + '>' + t + '</option>';
    }
    return html + '</select>';
  }

  // ---------------------------------------------------------------- 通信
  function gsRaw(name, args) {
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(e); });
      runner[name].apply(runner, args || []);
    });
  }

  /** token 付きでサーバーAPIを呼ぶ。セッション切れならログイン画面へ戻す */
  function api(name) {
    var rest = Array.prototype.slice.call(arguments, 1);
    showBusy(true);
    return gsRaw(name, [state.token].concat(rest))
      .catch(function (e) {
        if (String(e && e.message || '').indexOf('AUTH:') >= 0) {
          clearSession();
          renderLogin('ログインの有効期限が切れました。もう一度ログインしてください。');
        }
        throw e;
      })
      .finally(function () { showBusy(false); });
  }

  function errMsg(e) {
    return String(e && e.message || e || 'エラーが発生しました').replace(/^(Error|Exception):\s*/, '').replace(/^AUTH:/, '');
  }

  // ---------------------------------------------------------------- 表示用データのキャッシュ
  // タブを切り替えるたびにサーバーへ取りに行くと毎回1〜3秒かかるため、
  // 読み取り系APIの結果を数分間使い回す。申請・承認などデータが変わる操作の後と、
  // ヘッダーの「更新」ボタンでキャッシュを捨てて取り直す。
  var CACHE_TTL_MS = 3 * 60 * 1000;
  var apiCache = {}; // APIメソッド名 -> { at: 取得時刻, data: 結果 }

  function cachedApi(name) {
    var hit = apiCache[name];
    if (hit && (Date.now() - hit.at) < CACHE_TTL_MS) return Promise.resolve(hit.data);
    return api(name).then(function (res) {
      apiCache[name] = { at: Date.now(), data: res };
      return res;
    });
  }

  function clearApiCache() {
    apiCache = {};
  }

  // ---------------------------------------------------------------- メッセージ・処理中表示
  var msgTimer = null;
  function showMsg(text, type) {
    var el = $id('msg');
    if (!el) return;
    el.textContent = text;
    el.className = type;
    el.style.display = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { el.style.display = 'none'; }, type === 'error' ? 9000 : 5000);
  }
  function showError(text) { showMsg(text, 'error'); }
  function showInfo(text) { showMsg(text, 'info'); }

  function showBusy(on) {
    var el = $id('busy');
    if (el) el.style.display = on ? 'flex' : 'none';
  }

  function clearSession() {
    state.token = '';
    state.user = null;
    apiCache = {};
    localStorage.removeItem('wfb_token');
  }

  // ---------------------------------------------------------------- ログイン画面
  function renderLogin(notice) {
    state.adminData = null;
    document.getElementById('app').innerHTML =
      '<div id="msg"></div><div id="busy">処理中...</div>' +
      '<div class="login-wrap"><div class="card">' +
      '<div class="login-title">割り振り変更簿</div>' +
      '<div class="login-sub muted" id="login-school">読み込み中...</div>' +
      '<label class="fld"><span class="cap">名前</span><select id="login-member"><option value="">読み込み中...</option></select></label>' +
      '<label class="fld"><span class="cap">PIN(暗証番号)</span><input type="password" id="login-pin" inputmode="numeric" autocomplete="off" placeholder="数字4〜8桁"></label>' +
      '<button class="btn" data-act="login" style="width:100%">ログイン</button>' +
      '<p class="muted small" style="margin-top:14px">名前が一覧にない場合や、PINを忘れた場合は管理職に連絡してください。</p>' +
      '</div></div>';
    if (notice) showError(notice);

    gsRaw('apiGetLoginList').then(function (res) {
      $id('login-school').textContent = (res.schoolName ? res.schoolName + ' ' : '') + res.nendo + '年度';
      var last = localStorage.getItem('wfb_member') || '';
      $id('login-member').innerHTML = '<option value="">選択してください</option>' + res.members.map(function (m) {
        return '<option value="' + esc(m.id) + '"' + (m.id === last ? ' selected' : '') + '>' + esc(m.name) + '</option>';
      }).join('');
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function doLogin() {
    var memberId = $id('login-member').value;
    var pin = $id('login-pin').value;
    if (!memberId) { showError('名前を選択してください。'); return; }
    if (!pin) { showError('PINを入力してください。'); return; }
    showBusy(true);
    gsRaw('apiLogin', [memberId, pin]).then(function (res) {
      clearApiCache();
      state.token = res.token;
      state.user = res.user;
      state.settings = res.settings;
      localStorage.setItem('wfb_token', res.token);
      localStorage.setItem('wfb_member', memberId);
      apiCache['apiGetAllData'] = { at: Date.now(), data: res }; // ログイン応答に全タブ分が同梱されている
      renderApp();
      switchView('mypage');
    }).catch(function (e) { showError(errMsg(e)); })
      .finally(function () { showBusy(false); });
  }

  // ---------------------------------------------------------------- アプリ全体の枠
  function tabsForUser() {
    var tabs = [
      { id: 'mypage', label: 'マイページ' },
      { id: 'usage', label: '利用申請' },
    ];
    if (state.user.canGrant) tabs.push({ id: 'grant', label: '付与申請' });
    tabs.push({ id: 'daily', label: '日別一覧' });
    if (state.user.isAdmin) tabs.push({ id: 'admin', label: '管理' });
    return tabs;
  }

  function renderApp() {
    var s = state.settings;
    document.getElementById('app').innerHTML =
      '<div id="msg"></div><div id="busy">処理中...</div>' +
      '<div class="header">' +
      '<div><div class="title">割り振り変更簿</div>' +
      '<div class="sub">' + esc((s.schoolName ? s.schoolName + ' / ' : '') + s.nendo + '年度') + '</div></div>' +
      '<div class="spacer"></div>' +
      '<div class="who">' + esc(state.user.name) + '(' + esc(state.user.role) + ')</div>' +
      '<button data-act="reload" title="最新の情報を取り直します">更新</button>' +
      '<button data-act="logout">ログアウト</button>' +
      '</div>' +
      '<div class="tabs" id="tabs"></div>' +
      '<div class="content" id="content"></div>';
    renderTabs();
  }

  function renderTabs() {
    $id('tabs').innerHTML = tabsForUser().map(function (t) {
      return '<button class="tab' + (t.id === state.view ? ' active' : '') + '" data-act="nav" data-view="' + t.id + '">' + t.label + '</button>';
    }).join('');
  }

  function switchView(view) {
    state.view = view;
    renderTabs();
    var c = $id('content');
    c.innerHTML = '<div class="boot">読み込み中...</div>';
    var fn = views[view];
    if (fn) fn().catch(function (e) {
      c.innerHTML = '<div class="card"><p class="danger-text">' + esc(errMsg(e)) + '</p></div>';
    });
  }

  // ---------------------------------------------------------------- 各画面
  var views = {};

  // ---- マイページ ----
  views.mypage = function () {
    return cachedApi('apiGetAllData').then(function (res) {
      state.user = res.user;
      state.settings = res.settings;
      var b = res.balance;
      var html = '';

      if (res.adminPending && (res.adminPending.grants + res.adminPending.usages) > 0) {
        html += '<div class="card" style="border-color:#fcd34d;background:#fffbeb">' +
          '<b>承認待ちがあります</b>: 付与 ' + res.adminPending.grants + ' 件 / 利用 ' + res.adminPending.usages + ' 件 ' +
          '<button class="btn sm" data-act="nav" data-view="admin" style="margin-left:8px">管理タブで確認</button></div>';
      }

      html += '<div class="card"><h2>残り利用時間</h2><div class="balance-grid">' +
        balCard('残り合計', b.totalRemain, true) +
        balCard('前年度繰越の残り' + (state.settings.carryExpired ? '(失効済み)' : ''), b.carryRemain, false) +
        balCard('今年度分の残り', b.currentRemain, false) +
        '</div>' +
        '<p class="muted small" style="margin-top:8px">繰越分(前年度の残り)から自動的に先に使われます。' +
        (state.settings.carryExpired ? '前年度繰越分は ' + esc(state.settings.expireDate) + ' に失効しました。' : '') +
        (b.pendingUsage > 0 ? ' 承認待ちの利用が ' + fmtMin(b.pendingUsage) + ' あります(承認されると残りから引かれます)。' : '') +
        (b.pendingGrant > 0 ? ' 承認待ちの付与が ' + fmtMin(b.pendingGrant) + ' あります(承認されると残りに足されます)。' : '') +
        '</p></div>';

      html += '<div class="card"><h2>累計(' + state.settings.nendo + '年度)</h2><div class="balance-grid">' +
        balCard('累積超過時間(承認済み付与)', b.grantApproved, false) +
        balCard('累積利用時間(承認済み)', b.carryUsed + b.currentUsed, false) +
        balCard('前年度からの繰越', b.carryStart, false) +
        '</div></div>';

      var pendingItems = res.pendingMine.grants.map(function (g) {
        return { kind: 'grant', id: g.id, text: '付与 ' + g.date + ' ' + g.start + '〜' + g.end + '(' + fmtMin(g.minutes) + ')' + (g.reason ? ' / ' + g.reason : '') };
      }).concat(res.pendingMine.usages.map(function (u) {
        return { kind: 'usage', id: u.id, text: '利用 ' + u.date + ' ' + u.start + '〜' + u.end + '(' + fmtMin(u.minutes) + ')' };
      }));
      html += '<div class="card"><h2>承認待ちの自分の申請</h2>';
      if (!pendingItems.length) {
        html += '<p class="muted">承認待ちの申請はありません。</p>';
      } else {
        html += pendingItems.map(function (it) {
          return '<div class="pend-row"><span>' + esc(it.text) + '</span>' +
            '<span class="pend-actions"><button class="btn sm secondary" data-act="withdraw" data-kind="' + it.kind + '" data-id="' + esc(it.id) + '">取り下げ</button></span></div>';
        }).join('');
      }
      html += '</div>';

      if (res.proposedPending && res.proposedPending.length) {
        html += '<div class="card"><h2>自分が起案した承認待ちの付与(他の教職員分)</h2>' +
          res.proposedPending.map(function (g) {
            return '<div class="pend-row"><span>' + esc(g.targetName + ' さん / ' + g.date + ' ' + g.start + '〜' + g.end + '(' + fmtMin(g.minutes) + ')' + (g.reason ? ' / ' + g.reason : '')) + '</span>' +
              '<span class="pend-actions"><button class="btn sm secondary" data-act="withdraw" data-kind="grant" data-id="' + esc(g.id) + '">取り下げ</button></span></div>';
          }).join('') + '</div>';
      }

      html += '<div class="card"><h2>最近の申請</h2>';
      if (!res.recent.length) {
        html += '<p class="muted">まだ申請はありません。</p>';
      } else {
        html += '<div class="tbl-wrap"><table class="tbl"><tr><th>種別</th><th>日付</th><th>時間帯</th><th>時間</th><th>状態</th><th>内容</th></tr>' +
          res.recent.map(function (r) {
            return '<tr><td>' + (r.kind === 'grant' ? '付与' : '利用') + '</td><td>' + esc(r.date) + '</td><td>' + esc(r.start + '〜' + r.end) + '</td>' +
              '<td class="num">' + fmtMin(r.minutes) + '</td><td>' + chip(r.status) + '</td><td>' + esc(r.label || '') + '</td></tr>';
          }).join('') + '</table></div>';
      }
      html += '</div>';

      html += '<details class="box"><summary>PIN(暗証番号)を変更する</summary>' +
        '<label class="fld" style="margin-top:8px"><span class="cap">現在のPIN</span><input type="password" id="pin-old" inputmode="numeric" autocomplete="off"></label>' +
        '<label class="fld"><span class="cap">新しいPIN(数字4〜8桁)</span><input type="password" id="pin-new1" inputmode="numeric" autocomplete="off"></label>' +
        '<label class="fld"><span class="cap">新しいPIN(確認)</span><input type="password" id="pin-new2" inputmode="numeric" autocomplete="off"></label>' +
        '<button class="btn sm" data-act="pin-change">変更する</button></details>';

      $id('content').innerHTML = html;
    });
  };

  function balCard(cap, minutes, main) {
    return '<div class="bal' + (main ? ' main' : '') + '"><div class="cap">' + esc(cap) + '</div>' +
      '<div class="val' + (minutes < 0 ? ' neg' : '') + '">' + fmtMin(minutes) + '</div></div>';
  }

  // ---- 利用申請 ----
  views.usage = function () {
    return cachedApi('apiGetAllData').then(function (res) {
      state.settings = res.settings;
      var b = res.balance;
      var workEnd = toMin(state.settings.workEnd);
      var html = '<div class="card"><h2>利用申請(割り振り変更を取る)</h2>' +
        '<p class="muted">勤務時間(' + esc(state.settings.workStart) + '〜' + esc(state.settings.workEnd) + ')のうち、勤務しない時間帯を5分単位で入力してください。管理職の承認後に確定します。</p>' +
        '<div class="balance-grid" style="margin-bottom:12px">' +
        balCard('利用可能時間(承認待ち分を除く)', b.available, true) +
        '</div>' +
        '<label class="fld"><span class="cap">取得日</span><input type="date" id="u-date" value="' + todayStr() + '" data-watch="preview"></label>' +
        '<label class="fld"><span class="cap">時間帯</span><span class="timerange">' +
        timeSelect('u-start', toTime(workEnd - 30)) + ' 〜 ' + timeSelect('u-end', toTime(workEnd)) +
        '</span></label>' +
        '<label class="fld"><span class="cap">備考(任意)</span><input type="text" id="u-note" maxlength="100"></label>' +
        '<div class="preview" id="u-preview"></div>' +
        '<button class="btn" data-act="usage-submit">この内容で申請する</button>' +
        '</div>';
      $id('content').innerHTML = html;
      updateUsagePreview();
    });
  };

  function updateUsagePreview() {
    var el = $id('u-preview');
    if (!el) return;
    var s = toMin($id('u-start').value), e = toMin($id('u-end').value);
    var ws = toMin(state.settings.workStart), we = toMin(state.settings.workEnd);
    if (s == null || e == null || s >= e) { el.innerHTML = '終了時刻は開始時刻より後にしてください。'; return; }
    var minutes = overlap(s, e, ws, we);
    el.innerHTML = '利用時間: <b>' + fmtMin(minutes) + '</b><br><span class="muted small">勤務時間(' +
      esc(state.settings.workStart) + '〜' + esc(state.settings.workEnd) + ')内の部分のみが利用時間になります。</span>';
  }

  function submitUsage() {
    var date = $id('u-date').value;
    var start = $id('u-start').value, end = $id('u-end').value;
    var note = $id('u-note').value;
    var s = toMin(start), e = toMin(end);
    if (!date) { showError('取得日を入力してください。'); return; }
    if (s == null || e == null || s >= e) { showError('時間帯を正しく入力してください。'); return; }
    var minutes = overlap(s, e, toMin(state.settings.workStart), toMin(state.settings.workEnd));
    if (minutes <= 0) { showError('入力された時間帯に勤務時間が含まれていません。'); return; }
    if (!confirm('利用を申請します。\n\n取得日: ' + date + '\n時間帯: ' + start + '〜' + end + '\n利用時間: ' + fmtMin(minutes) + '\n\nよろしいですか?')) return;
    api('apiSubmitUsage', { date: date, start: start, end: end, note: note }).then(function (res) {
      clearApiCache();
      showInfo('利用を申請しました(' + fmtMin(res.minutes) + ')。管理職の承認をお待ちください。');
      switchView('mypage');
    }).catch(function (e2) { showError(errMsg(e2)); });
  }

  // ---- 付与申請 ----
  views.grant = function () {
    return cachedApi('apiGetAllData').then(function (res) {
      var targets = res.grantTargets || [];
      var workEnd = toMin(state.settings.workEnd);
      var html = '<div class="card"><h2>付与申請(超過時間の割り振り)</h2>' +
        '<p class="muted">会議等で発生した勤務超過の時間帯を入力してください。勤務時間(' + esc(state.settings.workStart) + '〜' + esc(state.settings.workEnd) + ')の外の部分が、選んだ全員に同じ分数で付与されます。管理職の承認後に確定します。</p>' +
        '<label class="fld"><span class="cap">発生日</span><input type="date" id="g-date" value="' + todayStr() + '" data-watch="preview"></label>' +
        '<label class="fld"><span class="cap">時間帯</span><span class="timerange">' +
        timeSelect('g-start', toTime(workEnd)) + ' 〜 ' + timeSelect('g-end', toTime(workEnd + 30)) +
        '</span></label>' +
        '<label class="fld"><span class="cap">事由(会議名など)</span><input type="text" id="g-reason" maxlength="100" placeholder="例: 職員会議"></label>' +
        '<div><span class="cap" style="font-size:13px;color:#374151">対象の教職員 ' +
        '<button class="btn sm secondary" data-act="grant-toggle-all" style="margin-left:8px">全員選択 / 解除</button></span>' +
        '<div class="check-list" id="g-targets">' +
        targets.map(function (t) {
          return '<label><input type="checkbox" value="' + esc(t.id) + '" data-watch="preview">' + esc(t.name) + '</label>';
        }).join('') +
        '</div></div>' +
        '<div class="preview" id="g-preview"></div>' +
        '<button class="btn" data-act="grant-submit">この内容で起案する</button>' +
        '</div>' +
        '<details class="box"><summary>これまでの付与の履歴を見る(自分に付与された分)</summary>' +
        '<p class="muted small" style="margin-top:8px">承認状況・処理結果も確認できます。利用の履歴は「日別一覧」タブで確認してください。</p>' +
        grantTable(res.myGrants, false) +
        '</details>';
      $id('content').innerHTML = html;
      updateGrantPreview();
    });
  };

  function grantSelectedIds() {
    return Array.prototype.slice.call(document.querySelectorAll('#g-targets input:checked')).map(function (c) { return c.value; });
  }

  function updateGrantPreview() {
    var el = $id('g-preview');
    if (!el) return;
    var s = toMin($id('g-start').value), e = toMin($id('g-end').value);
    var ws = toMin(state.settings.workStart), we = toMin(state.settings.workEnd);
    if (s == null || e == null || s >= e) { el.innerHTML = '終了時刻は開始時刻より後にしてください。'; return; }
    var minutes = (e - s) - overlap(s, e, ws, we);
    var n = grantSelectedIds().length;
    el.innerHTML = '付与時間: <b>' + fmtMin(minutes) + '</b> × ' + n + '名<br><span class="muted small">勤務時間(' +
      esc(state.settings.workStart) + '〜' + esc(state.settings.workEnd) + ')の外の部分のみが付与時間になります。</span>';
  }

  function submitGrant() {
    var date = $id('g-date').value;
    var start = $id('g-start').value, end = $id('g-end').value;
    var reason = $id('g-reason').value.trim();
    var ids = grantSelectedIds();
    var s = toMin(start), e = toMin(end);
    if (!date) { showError('発生日を入力してください。'); return; }
    if (s == null || e == null || s >= e) { showError('時間帯を正しく入力してください。'); return; }
    if (!reason) { showError('事由を入力してください。'); return; }
    if (!ids.length) { showError('対象の教職員を選択してください。'); return; }
    var minutes = (e - s) - overlap(s, e, toMin(state.settings.workStart), toMin(state.settings.workEnd));
    if (minutes <= 0) { showError('入力された時間帯はすべて勤務時間内のため、付与時間が0分になります。'); return; }
    if (!confirm('付与を起案します。\n\n発生日: ' + date + '\n時間帯: ' + start + '〜' + end + '\n付与時間: ' + fmtMin(minutes) + ' × ' + ids.length + '名\n事由: ' + reason + '\n\nよろしいですか?')) return;
    api('apiSubmitGrant', { date: date, start: start, end: end, reason: reason, teacherIds: ids }).then(function (res) {
      clearApiCache();
      showInfo('付与を起案しました(' + fmtMin(res.minutes) + ' × ' + res.count + '名)。管理職の承認をお待ちください。');
      switchView('mypage');
    }).catch(function (e2) { showError(errMsg(e2)); });
  }

  // ---- 付与履歴の表(付与申請タブ内で使用) ----
  function grantTable(grants, showName) {
    if (!grants.length) return '<p class="muted">記録がありません。</p>';
    var rows = grants.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return '<div class="tbl-wrap"><table class="tbl"><tr>' +
      (showName ? '<th>対象者</th>' : '') +
      '<th>発生日</th><th>時間帯</th><th>付与時間</th><th>事由</th><th>起案者</th><th>状態</th><th>処理</th></tr>' +
      rows.map(function (g) {
        return '<tr>' + (showName ? '<td>' + esc(g.targetName) + '</td>' : '') +
          '<td>' + esc(g.date) + '</td><td>' + esc(g.start + '〜' + g.end) + '</td><td class="num">' + fmtMin(g.minutes) + '</td>' +
          '<td>' + esc(g.reason) + '</td><td>' + esc(g.proposerName) + '</td><td>' + chip(g.status) + '</td>' +
          '<td class="small muted">' + esc(decideInfo(g)) + '</td></tr>';
      }).join('') + '</table></div>';
  }

  function decideInfo(r) {
    var parts = [];
    if (r.decidedBy) parts.push(r.decidedBy + ' ' + r.decidedAt);
    if (r.decideMemo) parts.push(r.decideMemo);
    if (r.canceledBy) parts.push('取消: ' + r.canceledBy + ' ' + r.canceledAt);
    return parts.join(' / ');
  }

  /** 日付ごとにまとめて表示する(合計は承認済みのみ) */
  function dayGroups(items, showName) {
    if (!items.length) return '<p class="muted">記録がありません。</p>';
    var byDate = {};
    items.forEach(function (r) { (byDate[r.date] = byDate[r.date] || []).push(r); });

      var rows = byDate[d];
      var total = rows.filter(function (r) { return r.status === '承認済み'; })

      return '<div class="day-group"><div class="day-head"><span>' + esc(d) + '</span><span>承認済み合計: ' + fmtMin(total) + '</span></div>' +
        '<div class="day-body">' + rows.map(function (r) {
          return '<div class="day-row">' +
            (showName ? '<b>' + esc(r.name) + '</b>' : '') +
            '<span>' + esc(r.start + '〜' + r.end) + '</span><span>' + fmtMin(r.minutes) + '</span>' +
            chip(r.status) +
            (r.label ? '<span class="muted small">' + esc(r.label) + '</span>' : '') +
            '</div>';
        }).join('') + '</div></div>';
    }).join('');

  // 承認待ち
  adminSubs.pending = function (el, data) {

      html += '<p class="muted">承認待ちの付与はありません。</p>';
    } else {
      var byGroup = {};
      var order = [];
      pendingGrants.forEach(function (g) {
        if (!byGroup[g.groupId]) { byGroup[g.groupId] = []; order.push(g.groupId); }
        byGroup[g.groupId].push(g);
      });
      html += order.map(function (gid) {
        var rows = byGroup[gid];
        var head = rows[0];
        var allIds = rows.map(function (r) { return r.id; }).join(',');

          '<div style="margin-top:6px"><button class="btn sm" data-act="decide" data-kind="grant" data-ids="' + esc(allIds) + '" data-action="approve">全員を承認</button> ' +
          '<button class="btn sm danger" data-act="decide" data-kind="grant" data-ids="' + esc(allIds) + '" data-action="reject">全員を却下</button></div>' +
          '</div><div class="pg-body">' +
          rows.map(function (r) {
            return '<div class="pend-row"><span>' + esc(r.targetName) + ' さん</span>' +

              '<button class="btn sm" data-act="decide" data-kind="grant" data-ids="' + esc(r.id) + '" data-action="approve">承認</button>' +
              '<button class="btn sm danger" data-act="decide" data-kind="grant" data-ids="' + esc(r.id) + '" data-action="reject">却下</button>' +
              '</span></div>';
          }).join('') + '</div></div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="card"><h2>利用の承認待ち(' + pendingUsages.length + '件)</h2>';

      html += '<p class="muted">承認待ちの利用はありません。</p>';

        var b = findOverview(data, u.memberId);

          '<b>' + esc(u.memberName) + ' さん</b> ' + esc(u.date) + ' ' + esc(u.start + '〜' + u.end) + '(' + fmtMin(u.minutes) + ')' +

          '</div></div>';
      }).join('');

  };

  function findOverview(data, memberId) {
    return data.overview.filter(function (o) { return o.id === memberId; })[0];
  }

  function doDecide(kind, ids, action) {
    var idList = ids.split(',');
    var label = (kind === 'grant' ? '付与' : '利用') + ' ' + idList.length + '件';
    var memo = '';
    if (action === 'reject') {
      var input = prompt(label + ' を却下します。理由(任意・本人に通知されます):', '');
      if (input === null) return;
      memo = input;
    } else {
      if (!confirm(label + ' を承認します。よろしいですか?')) return;
    }
    api('apiAdminDecide', kind, idList, action, memo).then(function (res) {
      var text = (action === 'approve' ? '承認' : '却下') + ': ' + res.done.length + '件 完了';
      if (res.errors.length) text += '\n' + res.errors.map(function (e) { return e.message; }).join('\n');
      (res.errors.length ? showError : showInfo)(text);
      clearApiCache();
      refreshAdmin();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function renderRecordsTable() {

      data.grants.forEach(function (g) {
        items.push({ kind: 'grant', id: g.id, memberId: g.targetId, name: g.targetName, date: g.date, start: g.start, end: g.end, minutes: g.minutes, status: g.status, label: '事由: ' + g.reason + ' / 起案: ' + g.proposerName, info: decideInfo(g), requestedAt: g.requestedAt });

          : '<button class="btn sm" data-act="m-status" data-id="' + esc(m.id) + '" data-name="' + esc(m.name) + '" data-status="在籍">在籍に戻す(復帰)</button>') +

        '<details class="box" style="margin-top:14px"><summary>氏名の修正(改姓・入力ミスの訂正のみ)</summary>' +
        '<p class="danger-text small" style="margin:8px 0"><b>別の先生の名前に書き換えないでください。</b>残り時間と履歴がIDに紐づいたまま、その名前の人のものになってしまいます。' +
        '別の先生が着任した場合は「教職員を追加」、いなくなった先生は「停止」を使ってください。</p>' +
        '<label class="fld"><span class="cap">新しい氏名(同一人物のみ)</span><input type="text" id="m-newname" value="' + esc(m.name) + '"></label>' +
        '<button class="btn sm danger" data-act="m-rename" data-id="' + esc(m.id) + '" data-name="' + esc(m.name) + '">氏名を修正する</button></details>' +

        '<div style="margin-top:14px"><button class="btn secondary" data-act="m-cancel-edit">閉じる</button></div></div>';
    }

    html += '<div class="tbl-wrap"><table class="tbl">' +
      '<tr><th>ID</th><th>氏名</th><th>役職</th><th>PIN</th><th>メール</th><th>状態</th><th>繰越(分)</th><th>備考</th><th></th></tr>' +
      data.roster.map(function (r) {
        return '<tr class="' + (r.status !== '在籍' ? 'inactive' : '') + '">' +
          '<td>' + esc(r.id) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.role) + '</td>' +
          '<td>' + (r.pinSet ? '設定済み' : '<span class="danger-text">未設定</span>') +
          ' <button class="btn sm secondary" data-act="m-resetpin" data-id="' + esc(r.id) + '" data-name="' + esc(r.name) + '">初期化</button></td>' +
          '<td>' + esc(r.email || '-') + '</td><td>' + esc(r.status) + '</td>' +
          '<td class="num">' + r.carryMin + '</td><td class="small">' + esc(r.note) + '</td>' +
          '<td><button class="btn sm secondary" data-act="m-edit" data-id="' + esc(r.id) + '">変更</button></td></tr>';
      }).join('') + '</table></div></div>';
    el.innerHTML = html;
  };

  function addMember() {
    api('apiAdminAddMember', {
      name: $id('m-name').value,
      role: $id('m-role').value,
      email: $id('m-email').value,
      note: $id('m-note').value,
    }).then(function (res) {
      alert('登録しました(' + res.id + ')。\n\n初期PIN: ' + res.initialPin + '\n\n本人に伝えてください。この画面を閉じると再表示できません(忘れた場合は「PIN初期化」で再発行できます)。');
      state.editingMember = null;
      clearApiCache();
      refreshAdmin();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function saveContact(id) {
    api('apiAdminUpdateContact', {
      id: id,
      role: $id('m-role').value,
      email: $id('m-email').value,
      note: $id('m-note').value,
    }).then(function () {
      showInfo('保存しました。');
      state.editingMember = null;
      clearApiCache();
      refreshAdmin();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function setMemberStatus(id, name, status) {
    var msg = status === '停止'
      ? name + ' さんを「停止」にします。\n\n・ログインできなくなります\n・残り時間と履歴はそのまま保持されます\n・復帰したら「在籍」に戻すだけで元どおり使えます\n\nよろしいですか?'
      : name + ' さんを「在籍」に戻します。以前の残り時間と履歴がそのまま使えるようになります。よろしいですか?';
    if (!confirm(msg)) return;
    api('apiAdminSetMemberStatus', id, status).then(function (res) {
      showInfo(res.name + ' さんを「' + res.status + '」にしました。');
      state.editingMember = null;
      clearApiCache();
      refreshAdmin();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function renameMember(id, oldName) {
    var newName = $id('m-newname').value.trim();
    if (!newName) { showError('氏名を入力してください。'); return; }
    if (newName === oldName) { showError('氏名が変わっていません。'); return; }
    if (!confirm('「' + oldName + '」→「' + newName + '」に修正します。\n\n【確認】同じ人ですか?\n別の先生の名前に書き換えると、残り時間と履歴がその名前の人のものになってしまいます。\n(過去の申請記録の表示名は元の氏名のまま残ります)\n\nよろしいですか?')) return;
    api('apiAdminRenameMember', id, newName).then(function (res) {
      showInfo('氏名を「' + res.name + '」に修正しました。');
      state.editingMember = null;
      clearApiCache();
      refreshAdmin();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function resetPin(id, name) {
    if (!confirm((name || id) + ' さんのPINを初期化します。現在のPINは使えなくなります。よろしいですか?')) return;
    api('apiAdminResetPin', id).then(function (res) {
      alert(res.name + ' さんの新しいPIN: ' + res.pin + '\n\n本人に伝えてください。この画面を閉じると再表示できません(必要なら再度初期化してください)。');
      clearApiCache();
      refreshAdmin();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  // ---- 年次更新(ウィザード形式・一本道) ----
  // state.wizard が null のときは入口画面、それ以外は step に応じた画面を表示する。
  adminSubs.year = function (el, data) {
    if (!state.wizard) { renderYearIntro(el, data); return; }
    var step = state.wizard.step;
    if (step === 'choose') renderYwChoose(el, data);
    else if (step === 'check') renderYwCheck(el, data);
    else if (step === 'personnel') renderYwPersonnel(el, data);
    else if (step === 'confirm') renderYwConfirm(el, data);
    else if (step === 'done') renderYwDone(el);
    else if (step === 'expire') renderYwExpire(el, data);
    else if (step === 'expdone') renderYwExpDone(el);
  };

  function cancelBtn() {
    return '<button class="btn secondary" data-act="yw-cancel">中止</button>';
  }

  /** 時期と状態から、今やるべき作業を推定する */
  function recommendTask(data) {
    var anyCarry = data.overview.some(function (o) { return o.status === '在籍' && o.carryRemain > 0; });
    var month = new Date().getMonth() + 1;
    if (!data.settings.carryExpired && anyCarry && month >= 5 && month <= 12) return 'expire';
    return 'switch';
  }

  function renderYearIntro(el, data) {
    var s = data.settings;
    el.innerHTML = '<div class="card"><h2>年次更新</h2>' +
      '<p>現在: <b>' + s.nendo + '年度</b> / 前年度から繰り越した時間: ' +
      (s.carryExpired ? '<b>失効済み(' + esc(s.expireDate) + ')</b>' : '<b>有効</b>') + '</p>' +
      '<p class="muted">年次更新は年に2回だけの作業です。下のボタンを押すと、あとは画面の案内に従って進むだけで完了します。途中でデータが変わることはなく、最後の「実行」ボタンを押すまで何度でも戻れます。</p>' +
      '<ul class="muted small">' +
      '<li><b>3月末〜4月:</b> 新年度への切り替え(残り時間の繰越と、転出・転入の反映)</li>' +
      '<li><b>6月頃:</b> 前年度から繰り越した時間の失効</li></ul>' +
      '<button class="btn" data-act="yw-start">年次更新をスタート</button>' +
      '<p class="muted small" style="margin-top:10px">年度の途中の転入・転出は、ここではなく「名簿」タブで行ってください。</p>' +
      '</div>';
  }

  function renderYwChoose(el, data) {
    var rec = recommendTask(data);
    var task = state.wizard.task || rec;
    var radio = function (val, title, desc) {
      return '<label style="display:block;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;background:#fff">' +
        '<input type="radio" name="yw-task" value="' + val + '"' + (task === val ? ' checked' : '') + '> <b>' + title + '</b>' +
        (rec === val ? ' <span class="chip approved">おすすめ(時期から判断)</span>' : '') +
        '<div class="muted small" style="margin-left:22px;margin-top:4px">' + desc + '</div></label>';
    };
    el.innerHTML = '<div class="card"><h2>年次更新: 今日行う作業を選んでください</h2>' +
      radio('switch', '新年度への切り替え(3月末〜4月に1回)',
        '今年度(' + data.settings.nendo + '年度)の記録を締めて、' + (data.settings.nendo + 1) + '年度を始めます。全員の残り時間は自動で新年度に繰り越されます。転出・転入の反映もこの中で行います。<br>' +
        '例: 3月29日に実行 → 残り1時間30分だった先生は、新年度の画面で「前年度繰越の残り 1時間30分」からスタートします。') +
      radio('expire', '前年度繰越分の失効(6月頃に1回)',
        '前年度から繰り越した時間のうち、まだ使われていない分を使えなくします。<b>今年度に付与された時間はそのまま残ります。</b><br>' +
        '例: 6月30日に実行 → 前年度繰越の残り30分は消えますが、今年度分の残り2時間はそのまま使えます。') +
      '<div style="margin-top:14px"><button class="btn" data-act="yw-choose-next">次へ</button> ' + cancelBtn() + '</div></div>';
  }

  function renderYwCheck(el, data) {
    var pendG = data.grants.filter(function (g) { return g.status === '承認待ち'; }).length;
    var pendU = data.usages.filter(function (u) { return u.status === '承認待ち'; }).length;
    var ok = pendG + pendU === 0;
    el.innerHTML = '<div class="card"><h2>新年度への切り替え(1/3): 実行前のチェック</h2>' +
      (ok
        ? '<p>✅ 承認待ちの申請はありません。このまま進めます。</p>'
        : '<p class="danger-text">⚠ 承認待ちの申請が残っています(付与 ' + pendG + ' 件・利用 ' + pendU + ' 件)。先にすべて承認または却下してください。</p>' +
          '<p><button class="btn sm" data-act="admin-sub" data-sub="pending">承認待ちを処理しに行く</button><br>' +
          '<span class="muted small">処理が終わって「年次更新」タブに戻ると、この続きから再開できます。</span></p>') +
      '<h3>実行すると自動で行われること</h3>' +
      '<ol class="muted">' +
      '<li>スプレッドシート全体のバックアップを作成(Googleドライブに「【バックアップ】…」という名前で保存されるので、万一間違えても元に戻せます)</li>' +
      '<li>全員の残り時間を ' + (data.settings.nendo + 1) + '年度の「前年度繰越」として引き継ぎ</li>' +
      '<li>' + data.settings.nendo + '年度の付与・利用の記録を削除し、年度を ' + data.settings.nendo + ' → ' + (data.settings.nendo + 1) + ' に変更</li></ol>' +
      '<p class="muted small">例: 山田先生の残りが1時間30分 → 新年度の画面では「前年度繰越の残り 1時間30分」と表示されます。</p>' +
      '<div style="margin-top:14px">' +
      '<button class="btn" data-act="yw-go" data-to="personnel"' + (ok ? '' : ' disabled') + '>次へ(人事異動の入力)</button> ' +
      '<button class="btn secondary" data-act="yw-go" data-to="choose">戻る</button> ' + cancelBtn() +
      '</div></div>';
  }

  function iyRowHtml(m, i) {
    return '<div class="iy-row timerange" style="margin-bottom:6px">' +
      '<input type="text" class="iy-name" placeholder="氏名" value="' + esc(m.name) + '" style="max-width:170px">' +
      '<select class="iy-role" style="width:110px">' +
      ['教員', '主任', '管理職'].map(function (r) { return '<option' + (m.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
      '</select>' +
      '<input type="text" class="iy-email" placeholder="メール(任意)" value="' + esc(m.email) + '" style="max-width:230px">' +
      '<button class="btn sm secondary" data-act="iy-del-row" data-idx="' + i + '">削除</button>' +
      '</div>';
  }

  function renderYwPersonnel(el, data) {
    var w = state.wizard;
    if (!w.ins.length) w.ins.push({ name: '', role: '教員', email: '' });
    var actives = data.roster.filter(function (r) { return r.status === '在籍'; });
    el.innerHTML = '<div class="card"><h2>新年度への切り替え(2/3): 人事異動の入力</h2>' +
      '<p class="muted">この春の異動を入力してください。<b>異動がない場合は、何もせずに「次へ」</b>で構いません。あとから「名簿」タブで直すこともできます。</p>' +
      '<h3>転出する先生(チェックした先生は新年度はログインできなくなります)</h3>' +
      '<p class="muted small">例: 田中先生が3月末で他校へ異動する → 田中先生にチェック。<br>残っていた時間は記録に残りますが、新年度には使われません。</p>' +
      '<div class="check-list" id="iy-out">' +
      actives.map(function (r) {
        var self = r.id === state.user.id;
        return '<label' + (self ? ' style="opacity:.55"' : '') + '><input type="checkbox" value="' + esc(r.id) + '"' +
          (self ? ' disabled' : (w.outs.indexOf(r.id) >= 0 ? ' checked' : '')) + '>' + esc(r.name) + (self ? '(自分)' : '') + '</label>';
      }).join('') + '</div>' +
      '<h3>転入してくる先生</h3>' +
      '<p class="muted small">例: 4月から佐藤花子先生(学年主任)が着任 → 氏名「佐藤花子」・役職「主任」と入力。<br>' +
      'ログイン用の暗証番号(初期PIN)は実行後に自動で発行され、画面に表示されます。メールは空欄でも構いません(登録すると通知メールが届くようになります)。</p>' +
      '<div id="iy-in">' + w.ins.map(iyRowHtml).join('') + '</div>' +
      '<button class="btn sm secondary" data-act="iy-add-row">+ 転入者の行を追加</button>' +
      '<div style="margin-top:14px">' +
      '<button class="btn" data-act="yw-personnel-next">次へ(最終確認)</button> ' +
      '<button class="btn secondary" data-act="yw-go" data-to="check">戻る</button> ' + cancelBtn() +
      '</div></div>';
  }

  /** 人事異動ステップの画面上の入力内容を state に保存する(画面の描き直しで消えないように) */
  function capturePersonnel() {
    if (!document.getElementById('iy-in')) return;
    var w = state.wizard;
    w.outs = Array.prototype.slice.call(document.querySelectorAll('#iy-out input:checked')).map(function (c) { return c.value; });
    w.ins = Array.prototype.slice.call(document.querySelectorAll('#iy-in .iy-row')).map(function (row) {
      return {
        name: row.querySelector('.iy-name').value.trim(),
        role: row.querySelector('.iy-role').value,
        email: row.querySelector('.iy-email').value.trim(),
      };
    });
  }

  function ywPersonnelNext() {
    capturePersonnel();
    var bad = null;
    state.wizard.ins.forEach(function (m, i) {
      if (!m.name && m.email) bad = '転入者の' + (i + 1) + '行目: メールだけ入力されています。氏名を入力するか、行を削除してください。';
    });
    if (bad) { showError(bad); return; }
    state.wizard.step = 'confirm';
    renderAdminSubFromCache();
  }

  function renderYwConfirm(el, data) {
    var w = state.wizard;
    var ins = w.ins.filter(function (m) { return m.name; });
    var outNames = w.outs.map(function (id) {
      var r = data.roster.filter(function (m) { return m.id === id; })[0];
      return r ? r.name : id;
    });
    var stay = data.overview.filter(function (o) { return o.status === '在籍' && w.outs.indexOf(o.id) < 0; });
    el.innerHTML = '<div class="card"><h2>新年度への切り替え(3/3): 最終確認</h2>' +
      '<p style="font-size:17px"><b>' + data.settings.nendo + '年度 → ' + (data.settings.nendo + 1) + '年度</b></p>' +
      '<h3>新年度に繰り越される残り時間</h3>' +
      '<div class="tbl-wrap"><table class="tbl"><tr><th>氏名</th><th>繰越時間</th></tr>' +
      stay.map(function (o) { return '<tr><td>' + esc(o.name) + '</td><td class="num">' + fmtMin(Math.max(o.totalRemain, 0)) + '</td></tr>'; }).join('') +
      '</table></div>' +
      '<h3>転出(停止): ' + outNames.length + '名</h3>' +
      '<p>' + (outNames.length ? esc(outNames.join('、')) : 'なし') + '</p>' +
      '<h3>転入(追加): ' + ins.length + '名</h3>' +
      '<p>' + (ins.length ? esc(ins.map(function (m) { return m.name + '(' + m.role + ')'; }).join('、')) : 'なし') + '</p>' +
      '<p class="danger-text"><b>実行すると元に戻せません</b>(直前のバックアップは自動で残ります)。内容が違う場合は「戻る」で直してください。</p>' +
      '<label class="fld"><span class="cap">確認のため「年度切替」と入力してください</span><input type="text" id="ys-input"></label>' +
      '<div><button class="btn danger" data-act="yw-exec-switch">年度切替を実行する</button> ' +
      '<button class="btn secondary" data-act="yw-go" data-to="personnel">戻る</button> ' + cancelBtn() + '</div></div>';
  }

  function ywExecSwitch() {
    var w = state.wizard;
    var ins = w.ins.filter(function (m) { return m.name; });
    api('apiAdminYearSwitch', $id('ys-input').value, { deactivateIds: w.outs, newMembers: ins }).then(function (res) {
      w.result = res;
      w.step = 'done';
      state.settings.nendo = res.newNendo;
      state.settings.carryExpired = false;
      state.settings.expireDate = '';
      var sub = document.querySelector('.header .sub');
      if (sub) sub.textContent = (state.settings.schoolName ? state.settings.schoolName + ' / ' : '') + res.newNendo + '年度';
      clearApiCache();
      renderAdminSubFromCache();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function renderYwDone(el) {
    var r = state.wizard.result;
    el.innerHTML = '<div class="card"><h2>✅ 年度切替が完了しました(' + r.newNendo + '年度開始)</h2>' +
      '<p class="muted small">バックアップ: ' + esc(r.backupName) + '(Googleドライブの「マイドライブ」に保存されています)</p>' +
      (r.deactivated.length ? '<p>転出(停止): ' + esc(r.deactivated.map(function (d) { return d.name; }).join('、')) + '</p>' : '') +
      (r.added.length
        ? '<h3>転入した先生の初期PIN</h3>' +
          '<p class="danger-text"><b>この画面を離れると再表示できません。</b>メモして本人に渡してください(忘れた場合は「名簿」タブの「PIN初期化」で再発行できます)。</p>' +
          '<div class="tbl-wrap"><table class="tbl"><tr><th>氏名</th><th>役職</th><th>初期PIN</th></tr>' +
          r.added.map(function (a) { return '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.role) + '</td><td><b>' + esc(a.initialPin) + '</b></td></tr>'; }).join('') +
          '</table></div>'
        : '') +
      '<h3>次の作業</h3>' +
      '<p class="muted">6月頃にもう一度このタブで「年次更新をスタート」し、「前年度繰越分の失効」を行ってください。それまで年次更新の作業はありません。</p>' +
      '<div style="margin-top:14px"><button class="btn" data-act="yw-finish">完了(管理画面に戻る)</button></div></div>';
  }

  function renderYwExpire(el, data) {
    if (data.settings.carryExpired) {
      el.innerHTML = '<div class="card"><h2>前年度繰越分の失効</h2>' +
        '<p>前年度繰越分はすでに失効済みです(' + esc(data.settings.expireDate) + ')。この作業は不要です。</p>' +
        '<div><button class="btn secondary" data-act="yw-go" data-to="choose">戻る</button> ' + cancelBtn() + '</div></div>';
      return;
    }
    var affected = data.overview.filter(function (o) { return o.status === '在籍' && o.carryRemain > 0; });
    el.innerHTML = '<div class="card"><h2>前年度繰越分の失効(1/1): 内容の確認</h2>' +
      '<p class="muted">前年度から繰り越した時間のうち、まだ使われていない分を使えなくします。<b>今年度に付与された時間はそのまま残ります。</b></p>' +
      '<p class="muted small">例: 山田先生が「前年度繰越の残り30分」と「今年度分の残り2時間」を持っている場合 → 実行後は今年度分の2時間だけになります。</p>' +
      '<h3>失効する時間</h3>' +
      (affected.length
        ? '<div class="tbl-wrap"><table class="tbl"><tr><th>氏名</th><th>失効する時間</th></tr>' +
          affected.map(function (o) { return '<tr><td>' + esc(o.name) + '</td><td class="num">' + fmtMin(o.carryRemain) + '</td></tr>'; }).join('') + '</table></div>'
        : '<p>繰越分が残っている先生はいません(全員使い切っています)。実行しても残り時間は変わりません。</p>') +
      '<p class="muted small">間違えて実行した場合も元に戻せます(運用・引き継ぎマニュアル参照)。</p>' +
      '<label class="fld"><span class="cap">確認のため「失効」と入力してください</span><input type="text" id="exp-input"></label>' +
      '<div><button class="btn danger" data-act="yw-exec-expire">失効を実行する</button> ' +
      '<button class="btn secondary" data-act="yw-go" data-to="choose">戻る</button> ' + cancelBtn() + '</div></div>';
  }

  function ywExecExpire() {
    api('apiAdminExpireCarryover', $id('exp-input').value).then(function (res) {
      state.wizard.result = res;
      state.wizard.step = 'expdone';
      state.settings.carryExpired = true;
      state.settings.expireDate = res.date;
      clearApiCache();
      renderAdminSubFromCache();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  function renderYwExpDone(el) {
    var r = state.wizard.result;
    el.innerHTML = '<div class="card"><h2>✅ 前年度繰越分を失効させました(' + esc(r.date) + ')</h2>' +
      (r.affected.length
        ? '<div class="tbl-wrap"><table class="tbl"><tr><th>氏名</th><th>失効した時間</th></tr>' +
          r.affected.map(function (a) { return '<tr><td>' + esc(a.name) + '</td><td class="num">' + fmtMin(a.minutes) + '</td></tr>'; }).join('') + '</table></div>'
        : '<p>繰越分が残っている先生はいなかったため、残り時間に変化はありません。</p>') +
      '<h3>次の作業</h3><p class="muted">次は3月末〜4月の「新年度への切り替え」です。それまで年次更新の作業はありません。</p>' +
      '<div style="margin-top:14px"><button class="btn" data-act="yw-finish">完了(管理画面に戻る)</button></div></div>';
  }

  /** ウィザード開始: 最新データを取り直してから始める */
  function ywStart() {
    clearApiCache();
    cachedApi('apiGetAllData').then(function (d) {
      state.settings = d.settings;
      state.adminData = Object.assign({ settings: d.settings }, d.admin);
      state.wizard = { task: null, step: 'choose', outs: [], ins: [], result: null };
      renderAdminSubFromCache();
    }).catch(function (e) { showError(errMsg(e)); });
  }

  // 設定
  adminSubs.settings = function (el, data) {
    var s = data.settings;
    el.innerHTML = '<div class="card"><h2>設定</h2>' +
      '<label class="fld"><span class="cap">学校名(画面に表示)</span><input type="text" id="s-school" value="' + esc(s.schoolName) + '"></label>' +
      '<label class="fld"><span class="cap">勤務時間</span><span class="timerange">' +
      timeSelect('s-wstart', s.workStart) + ' 〜 ' + timeSelect('s-wend', s.workEnd) + '</span>' +
      '<span class="muted small">付与は勤務時間の外、利用は勤務時間の中の分数で計算されます。</span></label>' +
      '<label class="fld"><input type="checkbox" id="s-mail-admins"' + (s.mailToAdmins ? ' checked' : '') + '> 申請があったとき管理職へ承認依頼メールを送る</label>' +
      '<label class="fld"><input type="checkbox" id="s-mail-members"' + (s.mailToMembers ? ' checked' : '') + '> 承認・却下・取消のとき本人へ結果メールを送る(メール登録者のみ)</label>' +
      '<button class="btn" data-act="s-save">保存</button>' +
      '<p class="muted small" style="margin-top:10px">メールは、このシステムを設置したGoogleアカウントから送信されます。宛先は名簿のメールアドレス欄で管理します。</p></div>';
  };

  function saveSettings() {
    api('apiAdminSaveSettings', {
      schoolName: $id('s-school').value,
      workStart: $id('s-wstart').value,
      workEnd: $id('s-wend').value,
      mailToAdmins: $id('s-mail-admins').checked,
      mailToMembers: $id('s-mail-members').checked,
    }).then(function (res) {
      state.settings = res;
      if (state.adminData) state.adminData.settings = res;
      showInfo('設定を保存しました。');
      clearApiCache();
      renderApp();
      switchView('admin');
    }).catch(function (e) { showError(errMsg(e)); });
  }

  // ---------------------------------------------------------------- 操作のディスパッチ
  function handleAction(act, ds) {
    switch (act) {
      case 'login': doLogin(); break;
      case 'logout':
        if (state.token) gsRaw('apiLogout', [state.token]);
        clearSession();
        renderLogin();
        break;
      case 'reload': clearApiCache(); switchView(state.view); break;
      case 'nav': switchView(ds.view); break;
      case 'withdraw':
        if (confirm('この申請を取り下げます。よろしいですか?')) {
          api('apiWithdraw', ds.kind, ds.id).then(function () {
            clearApiCache();
            showInfo('取り下げました。');
            switchView('mypage');
          }).catch(function (e) { showError(errMsg(e)); });
        }
        break;
      case 'pin-change': {
        var p1 = $id('pin-new1').value, p2 = $id('pin-new2').value;
        if (p1 !== p2) { showError('新しいPINが一致しません。'); break; }
        api('apiChangePin', $id('pin-old').value, p1).then(function () {
          showInfo('PINを変更しました。');
          switchView('mypage');
        }).catch(function (e) { showError(errMsg(e)); });
        break;
      }
      case 'usage-submit': submitUsage(); break;
      case 'grant-submit': submitGrant(); break;
      case 'grant-toggle-all': {
        var boxes = document.querySelectorAll('#g-targets input');
        var allChecked = Array.prototype.every.call(boxes, function (b) { return b.checked; });
        Array.prototype.forEach.call(boxes, function (b) { b.checked = !allChecked; });
        updateGrantPreview();
        break;
      }
      case 'daily-kind': renderDaily(ds.kind); break;
      case 'admin-sub': state.adminSub = ds.sub; renderAdminSubFromCache(); break;
      case 'adaily-kind': renderAdminDaily(ds.kind); break;
      case 'decide': doDecide(ds.kind, ds.ids, ds.action); break;
      case 'rec-cancel': doCancel(ds.kind, ds.id, false); break;
      case 'm-new': state.editingMember = {}; renderAdminSubFromCache(); break;
      case 'm-edit': {
        var found = state.adminData.roster.filter(function (r) { return r.id === ds.id; })[0];
        state.editingMember = found ? JSON.parse(JSON.stringify(found)) : null;
        renderAdminSubFromCache();
        break;
      }
      case 'm-cancel-edit': state.editingMember = null; renderAdminSubFromCache(); break;
      case 'm-add': addMember(); break;
      case 'm-contact-save': saveContact(ds.id); break;
      case 'm-status': setMemberStatus(ds.id, ds.name, ds.status); break;
      case 'm-rename': renameMember(ds.id, ds.name); break;
      case 'm-resetpin': resetPin(ds.id, ds.name); break;
      case 'yw-start': ywStart(); break;
      case 'yw-cancel':
        if (confirm('年次更新を中止しますか?(入力した内容は破棄されますが、データは何も変更されていません)')) {
          state.wizard = null;
          renderAdminSubFromCache();
        }
        break;
      case 'yw-go':
        capturePersonnel();
        state.wizard.step = ds.to;
        renderAdminSubFromCache();
        break;
      case 'yw-choose-next': {
        var sel = document.querySelector('input[name="yw-task"]:checked');
        state.wizard.task = sel ? sel.value : 'switch';
        state.wizard.step = state.wizard.task === 'switch' ? 'check' : 'expire';
        renderAdminSubFromCache();
        break;
      }
      case 'yw-personnel-next': ywPersonnelNext(); break;
      case 'iy-add-row':
        capturePersonnel();
        state.wizard.ins.push({ name: '', role: '教員', email: '' });
        renderAdminSubFromCache();
        break;
      case 'iy-del-row':
        capturePersonnel();
        state.wizard.ins.splice(parseInt(ds.idx, 10), 1);
        renderAdminSubFromCache();
        break;
      case 'yw-exec-switch': ywExecSwitch(); break;
      case 'yw-exec-expire': ywExecExpire(); break;
      case 'yw-finish':
        state.wizard = null;
        clearApiCache();
        refreshAdmin();
        break;
      case 's-save': saveSettings(); break;
    }
  }

  function renderAdminSubFromCache() {
    // サブタブの切替表示を更新してから中身を描く
    var btns = document.querySelectorAll('.subtabs [data-act="admin-sub"]');
    Array.prototype.forEach.call(btns, function (b) {
      b.className = 'sub' + (b.getAttribute('data-sub') === state.adminSub ? ' active' : '');
    });
    renderAdminSub();
  }

  function handleWatch(watch) {
    if (watch === 'preview') {
      if ($id('u-preview')) updateUsagePreview();
      if ($id('g-preview')) updateGrantPreview();
    } else if (watch === 'records-filter') {
      state.adminFilter = {
        kind: $id('f-kind').value,
        status: $id('f-status').value,
        member: $id('f-member').value,
      };
      renderRecordsTable();
    }
  }

  // ---------------------------------------------------------------- 起動
  document.getElementById('app').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    handleAction(b.getAttribute('data-act'), {
      view: b.getAttribute('data-view'),
      kind: b.getAttribute('data-kind'),
      id: b.getAttribute('data-id'),
      ids: b.getAttribute('data-ids'),
      action: b.getAttribute('data-action'),
      sub: b.getAttribute('data-sub'),
      name: b.getAttribute('data-name'),
      to: b.getAttribute('data-to'),
      idx: b.getAttribute('data-idx'),
      status: b.getAttribute('data-status'),
    });
  });
  document.getElementById('app').addEventListener('change', function (ev) {
    var t = ev.target.closest('[data-watch]');
    if (t) handleWatch(t.getAttribute('data-watch'));
  });
  document.getElementById('app').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.id === 'login-pin') doLogin();
  });

  function boot() {
    if (!state.token) { renderLogin(); return; }
    showBusy(true);
    gsRaw('apiGetAllData', [state.token]).then(function (res) {
      state.user = res.user;
      state.settings = res.settings;
      apiCache['apiGetAllData'] = { at: Date.now(), data: res }; // 全タブ分を読み込み済み
      renderApp();
      switchView('mypage');
    }).catch(function () {
      clearSession();
      renderLogin();
    });
  }

  boot();
})();
</script>
